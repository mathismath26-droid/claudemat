<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
      #intro {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Inter, sans-serif;
        color: #f5f5f5;
        --black: #050505;
        --navy: #080d24;
        --white: #f5f5f5;
        --orange: #ff8a35;
        --red: #ff4242;
        --grey: #9296a5;
      }
      /* ---------- Scene 1 — typographic intro ---------- */
      .s1-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .phrase {
        position: absolute;
        font-weight: 700;
        font-size: 92px;
        letter-spacing: -0.025em;
        line-height: 1.1;
        white-space: nowrap;
        color: var(--white);
        opacity: 0;
      }
      .accent-word {
        position: relative;
        display: inline-block;
      }
      .accent-line {
        position: absolute;
        left: 2px;
        right: 2px;
        bottom: -14px;
        height: 5px;
        border-radius: 3px;
        background: var(--orange);
        transform-origin: left center;
        transform: scaleX(0);
      }
      </style>
      <div id="intro" data-composition-id="intro" data-width="1920" data-height="1080">
        <div class="s1-stage">
          <div id="p1" class="phrase">Avant tout</div>
          <div id="p2" class="phrase">on prend le temps</div>
          <div id="p3" class="phrase">de connaître votre <span class="accent-word">activité<span id="p3-line" class="accent-line"></span></span></div>
        </div>
      </div>
      <script>
(() => {
        const tl = gsap.timeline({ paused: true });
        // A human reading rhythm: each line settles, breathes, then hands over to the next.
        const inPhrase = (sel, t) =>
          tl.fromTo(sel, { opacity: 0, y: 14, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, t);
        const outPhrase = (sel, t, d) =>
          tl.to(sel, { opacity: 0, y: -12, filter: "blur(6px)", duration: d, ease: "power2.in" }, t);

        inPhrase("#p1", 0.35);
        outPhrase("#p1", 1.85, 0.32);
        inPhrase("#p2", 2.15);
        outPhrase("#p2", 3.75, 0.32);
        inPhrase("#p3", 4.05);
        tl.to("#p3-line", { scaleX: 1, duration: 0.42, ease: "power3.out" }, 4.8);
        outPhrase("#p3", 5.75, 0.45);

        window.__timelines["intro"] = tl;
      })();
      </script>
    </template>
  </body>
</html>
