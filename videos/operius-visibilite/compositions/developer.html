      <script>
(() => {
        // Keystroke times (scene-local s), generated with assets/sfx/typing.wav by tools/make_sfx.py.
        const KEYS = [0.25, 0.327, 0.48, 0.571, 0.722, 0.878, 0.992, 1.098, 1.197, 1.331, 1.908, 1.995, 2.14, 2.297, 2.403, 2.553, 2.668, 2.81, 2.887, 3.018, 3.518, 3.611, 3.741, 3.865, 3.957, 4.056, 4.138, 4.57, 4.699, 4.792, 4.891, 5.02, 5.137];
        const tl = gsap.timeline({ paused: true });

        // Depth arrival, then a slow camera push for the whole shot.
        tl.fromTo("#s4-camera", { opacity: 0, scale: 1.1, filter: "blur(10px)" }, { opacity: 1, scale: 1.0, filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0);
        tl.to("#s4-camera", { scale: 1.05, duration: 5.0, ease: "none" }, 0.4);

        // Typing: each line is written during one burst of keystrokes.
        tl.set(["#caret-1", "#caret-2", "#caret-3", "#caret-4"], { opacity: 0 }, 0);
        const typed = [
          ["#ty-1", "#caret-1", "#ln-10", 39, KEYS[0], KEYS[9]],
          ["#ty-2", "#caret-2", "#ln-11", 6, KEYS[10], KEYS[13]],
          ["#ty-3", "#caret-3", "#ln-12", 10, KEYS[14], KEYS[19]],
          ["#ty-4", "#caret-4", "#ln-15", 37, KEYS[20], KEYS[32]],
        ];
        typed.forEach(([ty, caret, line, chars, a, b], i) => {
          const end = b + 0.06;
          tl.set(caret, { opacity: 1 }, a - 0.02);
          tl.set(line, { className: "ln current" }, a - 0.02);
          tl.fromTo(ty, { width: "0ch" }, { width: chars + "ch", duration: end - a, ease: "steps(" + chars + ")" }, a);
          if (i < typed.length - 1) {
            tl.set(caret, { opacity: 0 }, typed[i + 1][4] - 0.02);
            tl.set(line, { className: "ln" }, typed[i + 1][4] - 0.02);
          }
        });
        tl.to("#caret-4", { opacity: 0, duration: 0.01, repeat: 1, yoyo: true, repeatDelay: 0.25 }, KEYS[32] + 0.1);

        // The preview reacts once the button line is written.
        tl.fromTo("#hero-btn", { scaleX: 0.3, opacity: 0.25 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, KEYS[9] + 0.1);

        // Hands follow every keystroke.
        KEYS.forEach((k, i) => {
          const hand = i % 2 === 0 ? "#hand-l" : "#hand-r";
          tl.to(hand, { y: 5, duration: 0.035, ease: "power1.in" }, k - 0.035);
          tl.to(hand, { y: 0, duration: 0.07, ease: "power1.out" }, k);
        });

        // Micro-movements: breathing posture, a glance, two blinks.
        tl.fromTo("#person", { y: 0 }, { y: -4, duration: 1.3, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
        tl.fromTo("#head", { rotation: 0 }, { rotation: -1.2, duration: 1.6, ease: "sine.inOut", repeat: 2, yoyo: true, svgOrigin: "400 560" }, 0.2);
        tl.to("#pupil", { attr: { cx: 503, cy: 433 }, duration: 0.25, ease: "power2.inOut" }, 1.8);
        tl.to("#pupil", { attr: { cx: 500, cy: 431 }, duration: 0.25, ease: "power2.inOut" }, 3.0);
        [1.4, 4.1].forEach((t) => {
          tl.to("#eye", { scaleY: 0.1, duration: 0.06, svgOrigin: "493 432" }, t);
          tl.to("#eye", { scaleY: 1, duration: 0.08, svgOrigin: "493 432" }, t + 0.06);
        });

        window.__timelines["developer"] = tl;
      })();
