<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --black: #050505;
        --navy: #080d24;
        --white: #f5f5f5;
        --orange: #ff8a35;
        --red: #ff4242;
        --grey: #9296a5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--black);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--black);
        font-family: Inter, sans-serif;
        color: var(--white);
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="24"
      data-width="1920"
      data-height="1080"
    >
      <!-- ============ SCENE 1 · 0 → 6.3 s · « Avant tout / on prend le temps / de connaître votre activité » ============ -->
      <div id="s1" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="6.3" data-track-index="0" data-width="1920" data-height="1080"></div>

      <!-- ============ SCENE 2+3 · 6.2 → 18.7 s · laptop, presence, reversal ============ -->
      <div id="s2" data-composition-id="presence" data-composition-src="compositions/presence.html" data-start="6.2" data-duration="12.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <!-- ============ SCENE 4 · 18.6 → 24 s · developer close-up (full 5 s from 19.0) ============ -->
      <div id="s4" data-composition-id="developer" data-composition-src="compositions/developer.html" data-start="18.6" data-duration="5.4" data-track-index="2" data-width="1920" data-height="1080"></div>

      <!-- ============ SOUND · effects only, no voice ============ -->
      <audio id="sfx-tone" src="assets/sfx/soft-tone.wav" data-start="0.35" data-duration="1.4" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-tick-a" src="assets/sfx/tick-a.wav" data-start="2.15" data-duration="0.5" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-tick-b" src="assets/sfx/tick-b.wav" data-start="4.05" data-duration="0.5" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-swell" src="assets/sfx/swell.wav" data-start="6.2" data-duration="1.6" data-track-index="12" data-volume="0.8"></audio>
      <audio id="sfx-screen" src="assets/sfx/screen-on.wav" data-start="7.8" data-duration="0.7" data-track-index="13" data-volume="0.8"></audio>
      <audio id="sfx-blip-1" src="assets/sfx/blip-1.wav" data-start="8.4" data-duration="0.32" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-blip-2" src="assets/sfx/blip-2.wav" data-start="8.8" data-duration="0.32" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-blip-3" src="assets/sfx/blip-3.wav" data-start="9.2" data-duration="0.32" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-blip-4" src="assets/sfx/blip-4.wav" data-start="9.6" data-duration="0.32" data-track-index="14" data-volume="0.8"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.wav" data-start="11" data-duration="1.3" data-track-index="15" data-volume="0.8"></audio>
      <audio id="sfx-buzzer" src="assets/sfx/buzzer.wav" data-start="14.1" data-duration="0.46" data-track-index="16" data-volume="0.9"></audio>
      <audio id="sfx-room" src="assets/sfx/room-tone.wav" data-start="18.6" data-duration="5.4" data-track-index="17" data-volume="1"></audio>
      <audio id="sfx-typing" src="assets/sfx/typing.wav" data-start="18.6" data-duration="5.4" data-track-index="18" data-volume="0.75"></audio>
    </div>

    <script>
      // Scenes own their motion (compositions/*.html); the root only sequences them and the sound.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
