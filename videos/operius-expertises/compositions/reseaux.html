      <script>
(() => {
  const R = document.getElementById('reseaux');
  const D = 7.7;
  const tl = gsap.timeline({ paused: true });
const q = (s) => R.querySelector(s);
const qa = (s) => Array.from(R.querySelectorAll(s));
const POSE = (id, name, t) => {
  qa('#' + id + ' img').forEach((i) => tl.set(i, { opacity: i.dataset.pose === name ? 1 : 0 }, t));
};
// jump: squash, stretch, arc, land. Returns end time.
const HOP = (id, t, dx, dy, h, dur) => {
  const m = q('#' + id), b = q('#' + id + ' .mb');
  tl.to(b, { scaleY: 0.86, scaleX: 1.1, duration: 0.14, ease: 'power2.out' }, t);
  tl.to(b, { scaleY: 1.1, scaleX: 0.93, duration: 0.14, ease: 'power2.out' }, t + 0.14);
  tl.to(m, { x: '+=' + dx, duration: dur, ease: 'none' }, t + 0.14);
  tl.to(m, { y: '+=' + (dy - h), duration: dur * 0.5, ease: 'power2.out' }, t + 0.14);
  tl.to(m, { y: '+=' + h, duration: dur * 0.5, ease: 'power2.in' }, t + 0.14 + dur * 0.5);
  tl.to(b, { scaleY: 0.88, scaleX: 1.08, duration: 0.1, ease: 'power2.in' }, t + 0.14 + dur);
  tl.to(b, { scaleY: 1, scaleX: 1, duration: 0.3, ease: 'elastic.out(1,0.5)' }, t + 0.24 + dur);
  return t + 0.54 + dur;
};
const IDLE = (id, t0, t1, amp) => {
  const b = q('#' + id + ' .mb');
  const per = 1.1, n = Math.max(1, Math.floor((t1 - t0) / per / 2));
  tl.to(b, { y: -(amp || 6), duration: per, ease: 'sine.inOut', yoyo: true, repeat: n * 2 - 1 }, t0);
};
const FLOATS = () => {
  qa('.dc').forEach((el, i) => {
    const a = +el.dataset.a || 14, d = +el.dataset.d || 3 + (i % 3), r = +el.dataset.r || 0;
    const n = Math.max(2, Math.round(D / d / 2) * 2);
    tl.to(el, { y: '+=' + a, rotation: '+=' + r, duration: d, ease: 'sine.inOut', yoyo: true, repeat: n - 1 }, 0);
  });
  qa('.pt').forEach((el, i) => {
    const a = 20 + (i % 5) * 9, d = 2.4 + (i % 4) * 0.7;
    tl.fromTo(el, { opacity: 0.2 }, { opacity: 1, y: '-=' + a, duration: d, ease: 'sine.inOut', yoyo: true, repeat: Math.max(1, Math.round(D / d / 2) * 2 - 1) }, (i % 7) * 0.2);
  });
};
const PORTAL_IN = (dur) => {
  dur = dur || 0.9;
  tl.fromTo(q('.portal'), { clipPath: 'circle(0% at 50% 52%)' }, { clipPath: 'circle(80% at 50% 52%)', duration: dur, ease: 'power3.inOut' }, 0);
  tl.fromTo(q('.cam'), { scale: 1.6 }, { scale: 1, duration: dur + 0.5, ease: 'power3.out' }, 0);
};
const ZOOM_OUT = (ox, oy, dur) => {
  dur = dur || 0.95;
  q('.cam').style.transformOrigin = ox + 'px ' + oy + 'px';
  tl.to(q('.cam'), { scale: 2.1, duration: dur, ease: 'power3.in' }, D - dur);
  tl.to(q('.portal'), { opacity: 0, duration: 0.3, ease: 'none' }, D - 0.3);
};
const TITLE = (t, hold) => {
  const bar = q('.tt-bar');
  tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'power3.out' }, t);
  qa('.tt .mi').forEach((el, i) => tl.fromTo(el, { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: 'power3.out' }, t + 0.1 + i * 0.14));

};


const m = q('#reseaux-m');

FLOATS();
PORTAL_IN(0.9);

// she slides in, looks over the post templates
POSE('reseaux-m', 'hello', 0);
tl.set(m, { x: -400 }, 0);

// she picks one: it grows into the finished post
POSE('reseaux-m', 'wink', 2.0);
tl.to(q('#reseaux-tp2'), { x: -130, y: -20, scale: 1.9, rotation: 0, duration: 0.6, ease: 'power3.inOut' }, 2.1);
tl.to([q('#reseaux-tp1'), q('#reseaux-tp3'), q('#reseaux-tp4')], { opacity: 0, scale: 0.6, duration: 0.4, ease: 'power2.in' }, 2.1);
tl.fromTo(q('#reseaux-p1'), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.5)' }, 2.55);
tl.to(q('#reseaux-tp2'), { opacity: 0, duration: 0.3 }, 2.6);
// the same visual adapts to other formats
tl.fromTo(q('#reseaux-p2'), { opacity: 0, x: -140, scale: 0.6 }, { opacity: 1, x: 0, scale: 1, duration: 0.6, ease: 'back.out(1.5)' }, 3.0);
tl.fromTo(q('#reseaux-p3'), { opacity: 0, y: -120, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'back.out(1.5)' }, 3.25);
POSE('reseaux-m', 'music', 3.2);
// the editorial calendar slides in
tl.fromTo(q('#reseaux-cal'), { opacity: 0, x: 200, rotationY: -30, transformPerspective: 1500 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.8, ease: 'power3.out' }, 3.5);
// posts take their dates, one after another
const from = [['#reseaux-p1', 750, 312], ['#reseaux-p2', 1050, 325], ['#reseaux-p3', 870, 647]];
const cellsXY = [[1328,258],[1504,258],[1240,366],[1416,366],[1592,366],[1328,474],[1504,474],[1680,474],[1416,582],[1592,582]];
cellsXY.forEach((c, i) => {

tl.to(q('#reseaux-p1'), { scale: 1.04, duration: 0.2, yoyo: true, repeat: 1 }, 4.3);
// she validates the calendar
POSE('reseaux-m', 'cheer', 5.9);
tl.to(q('#reseaux-ok'), { opacity: 1, scale: 1, duration: 0.5, ease: 'elastic.out(1,0.5)' }, 6.0);
// everything folds into luminous dots that spiral away
const starts = [[1328,258],[1504,258],[1240,366],[1416,366],[1592,366],[1328,474],[1504,474],[1680,474],[1416,582],[1592,582],[1290,235],[1702,511],[1565,600],[1545,403],[1449,588],[1334,331],[1257,532],[1741,442],[1459,261],[1527,466],[1516,277],[1225,485],[1616,543],[1405,466],[1649,438],[1392,470]];
starts.forEach((s, i) => {
  const d = q('#reseaux-d' + i);
  const a0 = Math.atan2(s[1] - 540, s[0] - 960), r0 = Math.hypot(s[0] - 960, s[1] - 540);
  const kf = [[0.7, 1.0], [0.42, 2.3], [0.14, 3.7], [0, 5.0]].map((k) => ({ x: 960 + Math.cos(a0 + k[1]) * r0 * k[0] - s[0], y: 540 + Math.sin(a0 + k[1]) * r0 * k[0] - s[1], duration: 0.32, ease: 'none' }));
  tl.set(d, { left: s[0], top: s[1], opacity: 1, x: 0, y: 0 }, 6.35 + (i % 6) * 0.03);
  tl.to(d, { keyframes: kf }, 6.4 + (i % 6) * 0.03);
});
tl.to(qa('#reseaux-cal, #reseaux-p1, #reseaux-p2, #reseaux-p3, .thumb, #reseaux-plat'), { opacity: 0, scale: 0.7, duration: 0.45, ease: 'power2.in' }, 6.3);
tl.to(m, { opacity: 0, duration: 0.4, ease: 'power1.in' }, 6.3);
tl.fromTo(q('#reseaux-vx'), { opacity: 0.9, scale: 0.2, rotation: 0 }, { opacity: 0, scale: 1.6, rotation: 360, duration: 1.1, ease: 'power2.out', immediateRender: false }, 6.5);
TITLE(0.9, 4.7);
ZOOM_OUT(960, 540, 0.9);

  window.__timelines['reseaux'] = tl;
})();
